name: Docker Build

on:
  push:
    branches:
      - master

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t homelab-backend:ci ./docker/python-nginx/backend

      - name: Run container
        run: docker run -d --name backend-test -p 8080:8080 homelab-backend:ci

      - name: Check container
        run: |
          docker ps -a
          docker logs backend-test

      - name: Test application
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8080/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
