name: Docker Build

on:
  push:
    branches:
      - master

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t homelab-backend:ci ./docker/python-nginx/backend

      - name: Run container
        run: docker run -d --name backend-test -p 8080:8080 homelab-backend:ci

      - name: Test application
        run: curl http://localhost:8080
