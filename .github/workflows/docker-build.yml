name: Docker Build

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/gytisnaujikas/homelab-backend:latest \
            ./docker/python-nginx/backend

      - name: Run container
        run: |
          docker run -d \
            --name backend-test \
            -p 8080:8080 \
            ghcr.io/gytisnaujikas/homelab-backend:latest

      - name: Check container
        run: |
          docker ps -a
          docker logs backend-test

      - name: Test application
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:8080/health; then
              break
            fi
            sleep 1
          done

          response=$(curl -fsS http://localhost:8080/)

          echo "Application response:"
          echo "$response"

          if [ "$response" != "Hello from Python backend!" ]; then
            echo "Unexpected application response"
            exit 1
          fi

          echo "Application test passed"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: 100.126.22.119

      - name: Test SSH connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            s1tyg@100.126.22.119 \
            "hostname"

      - name: Push Docker image
        run: |
          docker push ghcr.io/gytisnaujikas/homelab-backend:latest
